{% set name = "blop" %}
{% set version = "1.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/blop-{{ version }}.tar.gz
  sha256: 61b5999e905d8a3165e133112a42d9e2d928acde4913ce9e59b703e3e0eeadbe

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - bluesky-base >=1.14.2
    - networkx >=3
    - numpy
    - rich >=13
    - ax-platform >=1.3.0,<1.4
    - botorch >=0.18.0,<0.19.0
    - bluesky-queueserver-api
    - gpytorch
    - pytorch
    - websockets
    - xopt >3.0.0

test:
  imports:
    - blop
    - blop.callbacks
    - blop.callbacks.logger
    - blop.callbacks.router
    - blop.callbacks.utils
    - blop.plan_stubs
    - blop.plans
    - blop.protocols
    - blop.utils
    - blop.ax
    - blop.ax.agent
    - blop.ax.dof
    - blop.ax.objective
    - blop.ax.optimizer
    - blop.ax.queueserver_agent
    - blop.bayesian
    - blop.bayesian.kernels
    - blop.bayesian.models
    - blop.queueserver
    - blop.xopt
    - blop.xopt.optimizer
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/bluesky/blop
  summary: Bluesky optimization package
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://blueskyproject.io/blop

extra:
  recipe-maintainers:
    - mrakitin
    - thomaswmorris
    - thopkins32
